name: Publish TARMAC product site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "brand/social-preview.png"
      - "scripts/**"
      - ".github/workflows/pages.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Foundation artifacts
        run: npm run check:foundation
      - name: Assemble static site
        run: |
          mkdir -p _site/assets
          cp -R site/. _site/
          cp brand/social-preview.png _site/assets/social-preview.png
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
