<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">TARMAC operating model</title>
  <desc id="desc">Triage, Architecture, Release, and Monitoring form a continuous loop. Automation and Compliance span every pillar.</desc>
  <rect width="1200" height="700" fill="#07111f"/>
  <g stroke="#17324a" stroke-width="1" opacity="0.55">
    <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200M0 420H1200M0 490H1200M0 560H1200M0 630H1200"/>
    <path d="M100 0V700M200 0V700M300 0V700M400 0V700M500 0V700M600 0V700M700 0V700M800 0V700M900 0V700M1000 0V700M1100 0V700"/>
  </g>
  <text x="70" y="74" fill="#5eead4" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">TARMAC</text>
  <text x="70" y="112" fill="#f4f1e8" font-family="Arial, sans-serif" font-size="34" font-weight="700">Enterprise Delivery Operating Model</text>
  <g fill="none" stroke="#5eead4" stroke-width="4">
    <path d="M250 304H430M530 304H710M810 304H990"/>
    <path d="M1050 350C1050 485 150 485 150 350" stroke-dasharray="10 10"/>
  </g>
  <g fill="#0d1b2a" stroke="#5eead4" stroke-width="2">
    <rect x="90" y="250" width="180" height="108" rx="18"/><rect x="390" y="250" width="180" height="108" rx="18"/><rect x="690" y="250" width="180" height="108" rx="18"/><rect x="990" y="250" width="180" height="108" rx="18"/>
  </g>
  <g fill="#f4f1e8" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="180" y="296" font-size="16" fill="#5eead4" font-weight="700">T</text><text x="180" y="329" font-size="23" font-weight="700">TRIAGE</text>
    <text x="480" y="296" font-size="16" fill="#5eead4" font-weight="700">A</text><text x="480" y="329" font-size="23" font-weight="700">ARCHITECTURE</text>
    <text x="780" y="296" font-size="16" fill="#5eead4" font-weight="700">R</text><text x="780" y="329" font-size="23" font-weight="700">RELEASE</text>
    <text x="1080" y="296" font-size="16" fill="#5eead4" font-weight="700">M</text><text x="1080" y="329" font-size="23" font-weight="700">MONITORING</text>
  </g>
  <g>
    <rect x="150" y="522" width="420" height="74" rx="16" fill="#12263a" stroke="#7dd3fc"/><rect x="630" y="522" width="420" height="74" rx="16" fill="#12263a" stroke="#f5b942"/>
    <text x="360" y="552" fill="#7dd3fc" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="700">A — AUTOMATION &amp; CI/CD</text><text x="360" y="577" fill="#a9b7c6" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Accelerates and evidences every pillar</text>
    <text x="840" y="552" fill="#f5b942" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="700">C — COMPLIANCE &amp; GOVERNANCE</text><text x="840" y="577" fill="#a9b7c6" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Controls and assures every pillar</text>
  </g>
